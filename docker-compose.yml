services:
  postgres:
    image: postgres
    # chnage this to 5433 when testing but put back to 5432 for submission
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${LOCAL_DB_USER}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      POSTGRES_DB: ${CSE_312_DB}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER} -d ${CSE_312_DB}"]
      interval: 1s
      timeout: 5s
      retries: 20
      start_period: 0s

  app:
    build: .

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      LOCAL_DB_USER: ${LOCAL_DB_USER}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD}
      LOCAL_DB: ${CSE_312_DB}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

    ports:
      - "8080:8080"